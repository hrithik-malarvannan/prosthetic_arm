<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EMG Prosthetic Hand</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

    <header>
      <h1>EMG Prosthetic Hand</h1>
      <p>ESP32-Based Muscle-Controlled Prosthetic System</p>

      <div class="connection">
        <span id="statusDot"></span>
        <span id="statusText">Connecting...</span>
      </div>
    </header>

    <section class="stats">

      <div class="card">
        <h3>EMG Value</h3>
        <div class="value" id="emgVal">--</div>
      </div>

      <div class="card">
        <h3>Muscle Activity</h3>
        <div class="value" id="activityVal">--</div>
      </div>

      <div class="card">
        <h3>Hand State</h3>
        <div class="value" id="handState">--</div>
      </div>

      <div class="card">
        <h3>Mode</h3>
        <div class="value" id="mode">--</div>
      </div>

    </section>

    <section class="panel">

      <h2>Control Mode</h2>

      <button class="mode-button" onclick="setMode('auto')">
        EMG AUTO
      </button>

      <button class="mode-button" onclick="setMode('manual')">
        MANUAL
      </button>

      <p id="modeMessage">--</p>

    </section>

    <section class="panel">

      <h2>Quick Control</h2>

      <button onclick="setAllServos(0)">
        OPEN
      </button>

      <button onclick="setAllServos(90)">
        90°
      </button>

      <button onclick="setAllServos(180)">
        CLOSE
      </button>

    </section>

    <section class="panel">

      <h2>Individual Finger Control</h2>

      <div id="servos"></div>

    </section>

    <section class="panel">

      <h2>System Information</h2>

      <p>
        ESP32 IP:
        <span id="espIp">--</span>
      </p>

      <p>
        EMG Threshold:
        <span id="threshold">--</span>
      </p>

    </section>

  </div>

  <script>

    const servoNames = [
      "Thumb",
      "Index",
      "Middle",
      "Ring",
      "Pinky"
    ];

    const servosDiv =
      document.getElementById("servos");

    for (let i = 0; i < 5; i++) {

      const div =
        document.createElement("div");

      div.className = "servo-control";

      div.innerHTML = `
        <div class="servo-header">
          <h3>${servoNames[i]}</h3>
          <span id="angle${i}">0°</span>
        </div>

        <input
          type="range"
          min="0"
          max="180"
          value="0"
          id="servo${i}"
          oninput="moveServo(${i}, this.value)"
        >
      `;

      servosDiv.appendChild(div);
    }

    async function moveServo(id, angle) {

      document.getElementById(
        `angle${id}`
      ).textContent = `${angle}°`;

      try {

        const response =
          await fetch(
            `/servo?id=${id}&angle=${angle}`
          );

        if (!response.ok) {
          throw new Error(
            "Servo command failed"
          );
        }

      } catch (error) {

        console.error(error);

        document.getElementById(
          "modeMessage"
        ).textContent =
          "Failed to control servo";
      }
    }

    async function setAllServos(angle) {

      for (let i = 0; i < 5; i++) {

        document.getElementById(
          `servo${i}`
        ).value = angle;

        document.getElementById(
          `angle${i}`
        ).textContent = `${angle}°`;

        await moveServo(i, angle);
      }
    }

    async function setMode(mode) {

      try {

        const response =
          await fetch(
            `/mode?mode=${mode}`
          );

        const data =
          await response.json();

        if (!response.ok) {
          throw new Error(
            data.error || "Mode change failed"
          );
        }

        document.getElementById(
          "modeMessage"
        ).textContent =
          mode.toUpperCase() +
          " mode enabled";

        updateData();

      } catch (error) {

        document.getElementById(
          "modeMessage"
        ).textContent =
          "Failed to change mode";

        console.error(error);
      }
    }

    async function updateData() {

      try {

        const response =
          await fetch("/get-emg");

        const data =
          await response.json();

        document.getElementById(
          "emgVal"
        ).textContent =
          data.emgValue;

        document.getElementById(
          "activityVal"
        ).textContent =
          Math.round(data.activity);

        document.getElementById(
          "handState"
        ).textContent =
          data.handState;

        document.getElementById(
          "mode"
        ).textContent =
          data.mode;

        document.getElementById(
          "threshold"
        ).textContent =
          data.threshold;

        setConnection(true);

      } catch (error) {

        setConnection(false);

        console.error(
          "Failed to fetch EMG data:",
          error
        );
      }
    }

    async function updateStatus() {

      try {

        const response =
          await fetch("/status");

        const data =
          await response.json();

        if (data.wifi) {

          document.getElementById(
            "espIp"
          ).textContent =
            data.ip;

          setConnection(true);

        } else {

          setConnection(false);
        }

      } catch (error) {

        setConnection(false);
      }
    }

    function setConnection(connected) {

      const dot =
        document.getElementById(
          "statusDot"
        );

      const text =
        document.getElementById(
          "statusText"
        );

      if (connected) {

        dot.className = "connected";

        text.textContent =
          "ESP32 Connected";

      } else {

        dot.className = "disconnected";

        text.textContent =
          "ESP32 Disconnected";
      }
    }

    updateData();
    updateStatus();

    setInterval(
      updateData,
      1000
    );

    setInterval(
      updateStatus,
      5000
    );

  </script>

</body>

</html>
